name: Debug test output

on:
  push:
    branches: [main]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,desktop]"
      - name: Run tests and capture output
        id: tests
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-output.txt 2>&1
          code=$?
          echo "$code" > pytest-exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic
          path: |
            pytest-output.txt
            pytest-exit-code.txt
      - name: Preserve failure
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
