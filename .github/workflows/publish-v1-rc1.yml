name: Publish RC1

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ contains(github.event.head_commit.message, 'publish v1.0.0-rc.1') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.0-rc.1
      RELEASE_TARGET: bce3e01b8820e3eb1746321b471762c1ab10dd19
      ARTIFACT_RUN_ID: "35695187502"

    steps:
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          mkdir -p release-assets/portable release-assets/installer

          gh run download "$ARTIFACT_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name OdooAddonMigrator-Windows             --dir release-assets/portable

          gh run download "$ARTIFACT_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name OdooAddonMigrator-Installer             --dir release-assets/installer

          installer="$(find release-assets/installer -name OdooAddonMigrator_Setup.exe -type f -print -quit)"
          if [ -z "$installer" ]; then
            echo "OdooAddonMigrator_Setup.exe was not found in the installer artifact." >&2
            exit 1
          fi

          cp "$installer" release-assets/OdooAddonMigrator_Setup.exe
          (
            cd release-assets/portable
            zip -r ../OdooAddonMigrator-Windows.zip .
          )

          cat > release-notes.md <<'EOF'
          ## Odoo Addon Migrator v1.0.0-rc.1

          First public release candidate of the Windows desktop application.

          ### Download
          - **OdooAddonMigrator_Setup.exe** — recommended Windows installer.
          - **OdooAddonMigrator-Windows.zip** — portable build; extract it and run OdooAddonMigrator.exe.

          ### Highlights
          - Professional PySide6 desktop GUI.
          - Source-aware custom-addon migration across Odoo 14 → 19.
          - Registry-driven multi-hop migrations.
          - Verified official Odoo Community source snapshots.
          - Blocker / Review Required / Warning analysis.
          - Conservative automatic fixes with migration-step attribution.
          - Local migration report and unified diff.
          - Original custom addons remain untouched.
          - Static validation after migration.

          ### Important
          This is a **release candidate**. Static validation does not guarantee runtime or production compatibility. Install and business-workflow testing on the target Odoo version are still required.

          The Windows build is currently unsigned, so Microsoft SmartScreen may display a warning.

          Independent migration utility. Not affiliated with Odoo S.A.
          EOF

          gh release create "$RELEASE_TAG"             release-assets/OdooAddonMigrator_Setup.exe             release-assets/OdooAddonMigrator-Windows.zip             --repo "$GITHUB_REPOSITORY"             --target "$RELEASE_TARGET"             --title "Odoo Addon Migrator v1.0.0-rc.1"             --notes-file release-notes.md             --prerelease
