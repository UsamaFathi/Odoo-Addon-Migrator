name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop and packaging dependencies
        run: python -m pip install -e ".[desktop,dev,build]"
      - name: Test
        run: python -m pytest -q
      - name: Build onedir application
        run: .\scripts\build_windows.ps1 -SkipTests
      - name: Smoke test packaged executable
        run: .\dist\OdooAddonMigrator\OdooAddonMigrator.exe --smoke-test
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: OdooAddonMigrator-Windows
          path: dist/OdooAddonMigrator
