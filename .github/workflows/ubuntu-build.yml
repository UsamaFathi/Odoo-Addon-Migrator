name: Ubuntu desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libfontconfig1 \
            libx11-6 \
            libxcb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libdbus-1-3 \
            xdg-utils

      - name: Install desktop and packaging dependencies
        run: python -m pip install -e ".[desktop,dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Build Linux portable application
        run: bash scripts/build_linux.sh --skip-tests

      - name: Smoke test portable application
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/OdooAddonMigrator/OdooAddonMigrator --smoke-test

      - name: Build Debian package
        run: bash scripts/build_deb.sh

      - name: Install Debian package
        run: |
          sudo apt-get install -y ./dist/OdooAddonMigrator_*_amd64.deb

      - name: Smoke test installed application
        env:
          QT_QPA_PLATFORM: offscreen
        run: odoo-addon-migrator --smoke-test

      - name: Uninstall Debian package
        run: sudo apt-get remove -y odoo-addon-migrator

      - name: Upload Ubuntu portable build
        uses: actions/upload-artifact@v4
        with:
          name: OdooAddonMigrator-Ubuntu-x86_64
          path: dist/OdooAddonMigrator-Ubuntu-x86_64.tar.gz

      - name: Upload Ubuntu Debian package
        uses: actions/upload-artifact@v4
        with:
          name: OdooAddonMigrator-Ubuntu-DEB
          path: dist/OdooAddonMigrator_*_amd64.deb
