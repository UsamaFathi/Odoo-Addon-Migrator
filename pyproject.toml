[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "odoo-addon-migrator"
version = "1.0.0rc1"
description = "Local source-aware migration assistant for custom Odoo addons"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
dev = ["pytest>=8.0"]
build = ["PyInstaller>=6.11"]

[project.scripts]
odoo-migrator = "odoo_migrator.cli.main:app"
odoo-migrator-ui = "odoo_migrator.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_migrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
